services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahgooz
      POSTGRES_USER: mahgooz
      POSTGRES_PASSWORD: mahgooz
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahgooz -d mahgooz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
