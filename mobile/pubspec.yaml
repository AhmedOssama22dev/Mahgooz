name: mahgouz
description: "Mahgouz padel court booking — Book. Pay. Play."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  go_router: ^16.2.4
  provider: ^6.1.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/brand/mahgouz-app-icon.png
  adaptive_icon_background: "#1B7A4E"
  adaptive_icon_foreground: assets/brand/mahgouz-app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/mock/
